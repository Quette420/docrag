<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocRAG</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #6c757d; cursor: default; }
        .answer { margin-top: 20px; background: #e9ecef; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-size: 15px; }
        .answer:empty { display: none; }
        .status { color: #666; margin-top: 10px; font-style: italic; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>DocRAG</h1>
    <p>Ask a question about the indexed documentation:</p>
    <textarea id="question" placeholder="Type your question..."></textarea>
    <button id="askBtn">Ask</button>
    <div class="status" id="status"></div>
    <div class="answer" id="answer"></div>
</div>

<script>
    const questionInput = document.getElementById('question');
    const askBtn = document.getElementById('askBtn');
    const answerDiv = document.getElementById('answer');
    const statusDiv = document.getElementById('status');

    function setStatus(text, isError = false) {
        statusDiv.textContent = text;
        statusDiv.className = isError ? 'status error' : 'status';
    }

    async function ask() {
        const question = questionInput.value.trim();
        if (!question) {
            setStatus('Please enter a question.', true);
            return;
        }

        answerDiv.textContent = '';
        setStatus('Thinking...');
        askBtn.disabled = true;

        try {
            const response = await fetch('/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({ question })
            });

            if (!response.ok) {
                throw new Error(`Server error ${response.status}: ${await response.text()}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullAnswer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                // SSE events are separated by a blank line; the last piece may be incomplete.
                const events = buffer.split('\n\n');
                buffer = events.pop();

                for (const event of events) {
                    let eventType = 'message';
                    let data = '';
                    for (const line of event.split('\n')) {
                        if (line.startsWith('event:')) {
                            eventType = line.slice(6).trim();
                        } else if (line.startsWith('data:')) {
                            data = line.slice(5).trim();
                        }
                    }
                    // The server JSON-encodes every payload.
                    const payload = data ? JSON.parse(data) : '';

                    if (eventType === 'token') {
                        fullAnswer += payload;
                        answerDiv.textContent = fullAnswer;
                        setStatus(`Generating... (${fullAnswer.length} chars)`);
                    } else if (eventType === 'error') {
                        throw new Error(payload);
                    }
                }
            }
            setStatus('Done');
        } catch (err) {
            setStatus(`Error: ${err.message}`, true);
            console.error(err);
        } finally {
            askBtn.disabled = false;
        }
    }

    askBtn.addEventListener('click', ask);
    questionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
    });
</script>
</body>
</html>
